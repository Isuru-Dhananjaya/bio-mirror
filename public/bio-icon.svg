<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="120" fill="#050b0a"/>
  <!-- Glowing Lotus/Heart Abstract -->
  <path d="M256 120 C 120 120, 100 256, 256 400 C 412 256, 392 120, 256 120 Z" fill="url(#grad1)" opacity="0.8"/>
  <path d="M256 160 C 180 160, 160 256, 256 360 C 352 256, 332 160, 256 160 Z" fill="url(#grad2)" opacity="0.9"/>
  <!-- Core Pulse -->
  <circle cx="256" cy="256" r="40" fill="#00f0ff" filter="url(#glow)"/>
  
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#b800ff" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff41" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
